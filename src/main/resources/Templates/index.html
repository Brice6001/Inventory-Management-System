 <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventory</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.2.3/css/bootstrap.min.css">
</head>
<body>
    <div class="container">

    <div class="dev-list">
        <h3>Developed by:</h3>
        <ul>
            <li>24RP05647 – IGIRANEZA Daniella</li>
            <li>24RP15903 – NGOGA Private</li>
            <li>24RP10518 – NSABIMANA Brice</li>
        </ul>
    </div>
<div class="container mt-4">
    <h2>Product Inventory</h2>
    <p>Developed by: <span th:text="${developer}"></span></p>
    <a href="/add" class="btn btn-primary mb-3">Add Product</a>
    <table class="table table-bordered">
        <thead>
            <tr><th>ID</th><th>Name</th><th>Price</th><th>Action</th></tr>
        </thead>
        <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price}"></td>
                <td><a th:href="@{/delete/{id}(id=${p.id})}" class="btn btn-danger btn-sm">Delete</a></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
